<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Bankai Tech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">&#128187; Bankai Tech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li><li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li></ul>
    </div>
  </div>
</nav>
<main>
<header class="bg-dark text-light text-center py-5">
  <div class="container" data-aos="fade-down">
    <h1 class="display-5 fw-bold">Contact Us</h1>
    <p class="lead mb-0">Questions about an order or a product? Send us a message.</p>
  </div>
</header>
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7" data-aos="fade-up">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label">First name</label>
                <input type="text" class="form-control" id="firstName" placeholder="teddy">
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" class="form-control" id="lastName" placeholder="swims">
              </div>
              <div class="col-12">
                <label for="email" class="form-label">email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
              </div>
              <div class="col-12">
                <label for="subject" class="form-label">Subject</label>
                <select class="form-select" id="subject">
                  <option selected>subject</option>
                  <option>Order enquiry</option>
                  <option>Product question</option>
                  <option>Wholesale</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="How can we help?"></textarea>
              </div>
              <div class="col-12 d-grid">
                <button type="button" class="btn btn-dark btn-lg">Send message</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<footer class="bg-dark text-light py-4 mt-auto">
  <div class="container">
    <div class="row gy-3 align-items-center">
      <div class="col-md-4 text-center text-md-start fw-bold">&#128187; Bankai Tech</div>
      <div class="col-md-4 text-center">
        <a class="link-light me-3" href="index.html">Home</a>
        <a class="link-light me-3" href="products.html">Products</a>
        <a class="link-light me-3" href="about.html">About</a>
        <a class="link-light" href="contact.html">Contact</a>
      </div>
    </div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
